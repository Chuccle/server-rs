name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        feature: [ "no-default-features", "logging", "stats" ]

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      run: |
        echo "is_dependabot=false" >> $GITHUB_OUTPUT
        if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
          echo "is_dependabot=true" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive

    - name: Cache cargo registry and build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Get flatbuffers commit hash
      id: flatc_hash
      run: |
        cd buildtools/flatbuffers
        echo "flatc_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Cache Flatc build
      id: cache_flatc
      uses: actions/cache@v6
      with:
        path: /usr/local/bin/flatc
        key: ${{ runner.os }}-flatc-${{ steps.flatc_hash.outputs.flatc_hash }}
            
    - name: Install build tools
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      run: sudo apt update && sudo apt install -y cmake make

    - name: Build Flatc
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      run: |
          cd buildtools/flatbuffers
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release .
          make
          sudo make install

    - name: Test ${{ github.repository }}
      run: |
        if [ "${{ matrix.feature }}" = "no-default-features" ]; then
          cargo test --no-default-features --verbose
        else
          cargo test --features ${{ matrix.feature }} --verbose
        fi

    - name: Clippy ${{ github.repository }}
      run: |
        if [ "${{ matrix.feature }}" = "no-default-features" ]; then
          cargo clippy --no-default-features --all-targets -- -D warnings
        else
          cargo clippy --features ${{ matrix.feature }} --all-targets -- -D warnings
        fi

    - name: Build binaries on master builds
      if: github.ref == 'refs/heads/master'
      run: | 
        rustup target add x86_64-unknown-linux-musl
        sudo apt-get install -y musl-tools
        if [ "${{ matrix.feature }}" = "no-default-features" ]; then
          cargo build --no-default-features --verbose --release --target=x86_64-unknown-linux-musl
        else
          cargo build --features ${{ matrix.feature }} --verbose --release --target=x86_64-unknown-linux-musl
        fi
        BIN_PATH="target/x86_64-unknown-linux-musl/release/server-rs"
        strip "$BIN_PATH"

    - name: Upload binary artifact
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v7
      with:
        name: server-rs-${{ matrix.feature }}-x86_64-unknown-linux-musl
        path: target/x86_64-unknown-linux-musl/release/server-rs
  windows:
    runs-on: ubuntu-latest

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      run: |
        echo "is_dependabot=false" >> $GITHUB_OUTPUT
        if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
          echo "is_dependabot=true" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive

    - name: Cache cargo registry and build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-windows-gnu-${{ hashFiles('**/Cargo.lock') }}

    - name: Get flatbuffers commit hash
      id: flatc_hash
      run: echo "flatc_hash=$(git -C buildtools/flatbuffers rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Cache Flatc build
      id: cache_flatc
      uses: actions/cache@v6
      with:
        path: ~/flatc
        key: ${{ runner.os }}-flatc-bin-${{ steps.flatc_hash.outputs.flatc_hash }}

    - name: Build Flatc
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      run: |
        cmake -S buildtools/flatbuffers -B "$RUNNER_TEMP/flatc-build" -DCMAKE_BUILD_TYPE=Release \
          -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATLIB=OFF -DFLATBUFFERS_BUILD_FLATHASH=OFF
        cmake --build "$RUNNER_TEMP/flatc-build" --target flatc -j
        mkdir -p ~/flatc && cp "$RUNNER_TEMP/flatc-build/flatc" ~/flatc/

    - name: Install the cross toolchain
      run: |
        echo "$HOME/flatc" >> $GITHUB_PATH
        sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
        rustup target add x86_64-pc-windows-gnu

    - name: Build release binary
      run: cargo build --release --locked --target x86_64-pc-windows-gnu

    - name: Clippy
      run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings
  windows-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      run: |
        echo "is_dependabot=false" >> $GITHUB_OUTPUT
        if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
          echo "is_dependabot=true" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive

    - name: Cache cargo registry and build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('**/Cargo.lock') }}

    - name: Get flatbuffers commit hash
      id: flatc_hash
      run: echo "flatc_hash=$(git -C buildtools/flatbuffers rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Cache Flatc build
      id: cache_flatc
      uses: actions/cache@v6
      with:
        path: ~/flatc
        key: ${{ runner.os }}-flatc-bin-${{ steps.flatc_hash.outputs.flatc_hash }}

    - name: Build Flatc
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      run: |
        cmake -S buildtools/flatbuffers -B "$RUNNER_TEMP/flatc-build" \
          -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATLIB=OFF -DFLATBUFFERS_BUILD_FLATHASH=OFF
        cmake --build "$RUNNER_TEMP/flatc-build" --config Release --target flatc -j
        mkdir -p ~/flatc && cp "$RUNNER_TEMP/flatc-build/Release/flatc.exe" ~/flatc/

    - name: Put Flatc on the path
      run: cygpath -w ~/flatc >> $GITHUB_PATH

    - name: Test ${{ github.repository }}
      run: cargo test --locked --verbose
