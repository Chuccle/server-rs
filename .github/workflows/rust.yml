name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        feature: [ "no-default-features", "logging", "stats" ]

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      run: |
        echo "is_dependabot=false" >> $GITHUB_OUTPUT
        if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
          echo "is_dependabot=true" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive

    - name: Cache cargo registry and build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Get flatbuffers commit hash
      id: flatc_hash
      run: |
        cd buildtools/flatbuffers
        echo "flatc_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Cache Flatc build
      id: cache_flatc
      uses: actions/cache@v6
      with:
        path: /usr/local/bin/flatc
        key: ${{ runner.os }}-flatc-${{ steps.flatc_hash.outputs.flatc_hash }}
            
    - name: Install build tools
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      run: sudo apt update && sudo apt install -y cmake make

    - name: Build Flatc
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      run: |
          cd buildtools/flatbuffers
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release .
          make
          sudo make install

    - name: Test ${{ github.repository }}
      run: |
        if [ "${{ matrix.feature }}" = "no-default-features" ]; then
          cargo test --no-default-features --verbose
        else
          cargo test --features ${{ matrix.feature }} --verbose
        fi

    - name: Clippy ${{ github.repository }}
      run: |
        if [ "${{ matrix.feature }}" = "no-default-features" ]; then
          cargo clippy --no-default-features --all-targets -- -D warnings
        else
          cargo clippy --features ${{ matrix.feature }} --all-targets -- -D warnings
        fi

    - name: Build binaries on master builds
      if: github.ref == 'refs/heads/master'
      run: | 
        rustup target add x86_64-unknown-linux-musl
        sudo apt-get install -y musl-tools
        if [ "${{ matrix.feature }}" = "no-default-features" ]; then
          cargo build --no-default-features --verbose --release --target=x86_64-unknown-linux-musl
        else
          cargo build --features ${{ matrix.feature }} --verbose --release --target=x86_64-unknown-linux-musl
        fi
        BIN_PATH="target/x86_64-unknown-linux-musl/release/server-rs"
        strip "$BIN_PATH"

    - name: Upload binary artifact
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v7
      with:
        name: server-rs-${{ matrix.feature }}-x86_64-unknown-linux-musl
        path: target/x86_64-unknown-linux-musl/release/server-rs
  # BlorgFS packages this server for Windows (its build.yml pins this repo as
  # third_party/server-rs and ships server-rs.exe next to the driver), so a
  # change that breaks the Windows build has to fail here, before a package
  # bump picks it up. Build and compile the tests, including the cfg(windows)
  # branches in them; the Linux matrix above remains the test gate.
  windows:
    runs-on: windows-latest

    steps:
    - name: Detect if Dependabot
      id: is_dependabot
      shell: pwsh
      run: echo "is_dependabot=${{ github.actor == 'dependabot[bot]' }}" >> $env:GITHUB_OUTPUT

    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        token: ${{ steps.is_dependabot.outputs.is_dependabot == 'true' && secrets.GH_DEPENDABOT_PAT || secrets.GH_PAT }}
        submodules: recursive

    - name: Get flatbuffers commit hash
      id: flatc_hash
      shell: pwsh
      run: echo "flatc_hash=$(git -C buildtools/flatbuffers rev-parse HEAD)" >> $env:GITHUB_OUTPUT

    - name: Cache flatc build
      id: cache_flatc
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}\flatc
        key: ${{ runner.os }}-flatc-${{ steps.flatc_hash.outputs.flatc_hash }}

    - name: Build flatc
      if: steps.cache_flatc.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $build = Join-Path $env:RUNNER_TEMP 'flatc-build'
        cmake -S buildtools/flatbuffers -B $build `
          -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATLIB=OFF -DFLATBUFFERS_BUILD_FLATHASH=OFF
        if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }
        cmake --build $build --config Release --target flatc
        if ($LASTEXITCODE -ne 0) { throw "flatc build failed with exit code $LASTEXITCODE" }
        $dest = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'flatc')
        Copy-Item (Join-Path $build 'Release\flatc.exe') $dest

    - name: Put flatc on PATH
      shell: pwsh
      run: echo (Join-Path $env:RUNNER_TEMP 'flatc') >> $env:GITHUB_PATH

    - name: Cache cargo registry and build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --locked

    - name: Compile tests
      run: cargo test --locked --no-run
